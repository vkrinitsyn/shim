name: ci

# The tests, and their line coverage: under 90% fails the run. The coverage goes to
# Codecov (the README badge) through GitHub's OIDC token - no secret; the repository is
# enabled once at codecov.io.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a branch's newer push cancels its older run; on main each run stands (the badge):
  # a cancelled run there shows as failing
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Codecov's OIDC upload
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # 90: the line coverage measured 99.62% when this gate came in
      - run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 90
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          # a fork's pull request has no token: the gate above holds without the upload
          fail_ci_if_error: false
