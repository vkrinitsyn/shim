name: audit and geiger

# cargo audit: known vulnerabilities (RustSec) in the dependencies. cargo geiger:
# unsafe code in shims and in each crate it uses, on the run's summary page.
# On a push and a pull request (Dependabot's among them), and weekly: an advisory
# can come out with nothing changed here.
on:
  push:
    branches-ignore: ["dependabot/**"]   # their pull request runs it
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # a branch's newer push cancels its older run; on main each run stands (the badge):
  # a cancelled run there shows as failing
  group: audit-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # no Cargo.lock in the repository: the one a build would resolve today
      - run: cargo generate-lockfile
      - run: cargo audit

  geiger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      # a report, not a gate: the counts go to the log and the summary page
      - run: cargo geiger --output-format GitHubMarkdown | tee -a "$GITHUB_STEP_SUMMARY"
